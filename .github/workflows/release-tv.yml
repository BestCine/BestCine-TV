name: Build & Release BestCine TV

# Compila os instaladores oficiais do BestCine TV para todas as Smart TVs:
#   - LG webOS 3+ (.ipk + -highcache.ipk + repo.json + webosbrew.manifest.json)
#   - Samsung Tizen 4.0-9.0 nativo (.tpk: NuvioTpk40, NuvioTpk60, NuvioTpk65, NuvioTpk)
#   - Samsung Tizen 5.5+ WebAssembly (.wgt)
#   - Android TV / Google TV 7+ (um APK universal: arm64-v8a + armeabi-v7a)
# e publica tudo automaticamente na Release GitHub (ex.: v1.0.0).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da release (vazio usa v<version> de deploy/app/appinfo.json)"
        default: ""
      publicar_release:
        description: "Publicar automaticamente na aba Releases"
        type: boolean
        default: true
      incluir_webos:
        description: "Compilar LG webOS (.ipk + repo.json)"
        type: boolean
        default: true
      incluir_tpk:
        description: "Compilar Samsung Tizen .tpk (mais demorado na primeira vez)"
        type: boolean
        default: true
      incluir_wgt:
        description: "Compilar Samsung Tizen WASM (.wgt)"
        type: boolean
        default: true
      incluir_android:
        description: "Compilar Android TV / Fire TV (.apk)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # 1. LG webOS (.ipk + highcache + repo.json do Homebrew Channel)
  # ---------------------------------------------------------------------------
  webos:
    name: LG webOS (.ipk + repo.json)
    if: ${{ github.event.inputs.incluir_webos != 'false' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      NUVIO_P2P_MOTOR: none
      NUVIO_BUILD_PLATFORM: linux/arm64
      NUVIO_RUST_MKVCORE: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Node.js e ares-package (webOS CLI)
        run: |
          npm install -g @webos-tools/cli
          which ares-package

      - name: Preparar imagem Docker SDK webOS (ARM64 nativo)
        uses: docker/setup-buildx-action@v3

      - name: Compilar imagem nuvio-webos-sdk (com cache)
        uses: docker/build-push-action@v6
        with:
          context: tools
          file: tools/Dockerfile
          platforms: linux/arm64
          load: true
          tags: nuvio-webos-sdk:latest
          cache-from: type=gha,scope=webos-sdk
          cache-to: type=gha,mode=max,scope=webos-sdk

      - name: Preparar local.properties temporario (GitHub Secrets)
        env:
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          BESTCINE_CLIENT_SECRET: ${{ secrets.BESTCINE_CLIENT_SECRET }}
          BESTCINE_SERVER_URL: ${{ secrets.BESTCINE_SERVER_URL }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          NUVIO_SUPABASE_URL: ${{ secrets.NUVIO_SUPABASE_URL }}
          NUVIO_SUPABASE_ANON_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
        run: |
          umask 077
          {
            [ -n "$TRAKT_CLIENT_ID" ] && printf 'TRAKT_CLIENT_ID=%s\n' "$TRAKT_CLIENT_ID"
            [ -n "$TRAKT_CLIENT_SECRET" ] && printf 'TRAKT_CLIENT_SECRET=%s\n' "$TRAKT_CLIENT_SECRET"
            [ -n "$SIMKL_CLIENT_ID" ] && printf 'SIMKL_CLIENT_ID=%s\n' "$SIMKL_CLIENT_ID"
            [ -n "$TMDB_API_KEY" ] && printf 'TMDB_API_KEY=%s\n' "$TMDB_API_KEY"
            [ -n "$BESTCINE_CLIENT_SECRET" ] && printf 'BESTCINE_CLIENT_SECRET=%s\n' "$BESTCINE_CLIENT_SECRET"
            [ -n "$BESTCINE_SERVER_URL" ] && printf 'BESTCINE_SERVER_URL=%s\n' "$BESTCINE_SERVER_URL"
            [ -n "$DISCORD_CLIENT_ID" ] && printf 'DISCORD_CLIENT_ID=%s\n' "$DISCORD_CLIENT_ID"
            [ -n "$NUVIO_SUPABASE_URL" ] && printf 'NUVIO_SUPABASE_URL=%s\n' "$NUVIO_SUPABASE_URL"
            [ -n "$NUVIO_SUPABASE_ANON_KEY" ] && printf 'NUVIO_SUPABASE_ANON_KEY=%s\n' "$NUVIO_SUPABASE_ANON_KEY"
            printf 'SIMKL_APP_NAME=BestCine\n'
          } > local.properties

      - name: Compilar BestCine TV (.ipk normal e high-cache)
        run: |
          set -o pipefail
          export NUVIO_ARES_PACKAGE="$(which ares-package)"
          export NUVIO_RELEASE_OUT="$PWD/dist-webos"
          mkdir -p "$NUVIO_RELEASE_OUT"
          bash tools/arm.sh --ipk --build 2>&1 | tee build-webos.log
          bash tools/arm.sh --high-cache --ipk --build 2>&1 | tee -a build-webos.log
          VER=$(python3 -c 'import json; print(json.load(open("deploy/app/appinfo.json"))["version"])')
          bash tools/hb-repo.sh "$NUVIO_RELEASE_OUT/com.bestcine.tv_${VER}_arm.ipk" "$NUVIO_RELEASE_OUT"
          ls -lh "$NUVIO_RELEASE_OUT"

      - name: Resumo em caso de erro
        if: failure()
        run: |
          echo '### webOS build failed (ultimas 80 linhas)' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 80 build-webos.log >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Limpar local.properties temporario
        if: always()
        run: rm -f local.properties

      - name: Upload artefatos LG webOS
        uses: actions/upload-artifact@v4
        with:
          name: dist-webos
          path: dist-webos/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 2. Samsung Tizen 4.0-9.0 nativo (.tpk)
  # ---------------------------------------------------------------------------
  tizen-tpk:
    name: Samsung Tizen nativo (.tpk)
    if: ${{ github.event.inputs.incluir_tpk != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      NV_TPK_PACOTES: "NuvioTpk40 NuvioTpk60 NuvioTpk65 NuvioTpk"
      NUVIO_P2P_MOTOR: none
      DOTNET_ROOT: ${{ github.workspace }}/.dotnet
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      NUVIO_TPK_CACHE: ${{ github.workspace }}/.cache/nuvio-tpk
    steps:
      - uses: actions/checkout@v4

      - name: Habilitar emulacao ARM para Docker
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Restaurar cache das dependencias estaticas TPK
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.NUVIO_TPK_CACHE }}
          key: tpk-deps-${{ hashFiles('tools/tpk/Dockerfile', 'tools/tpk/deps.sh') }}

      - name: Restaurar cache FFmpeg (DTS)
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.NUVIO_TPK_CACHE }}/prefix-dts
          key: tpk-dts-ffmpeg-${{ hashFiles('tools/build-dts-ffmpeg.sh') }}

      - name: Instalar .NET 8 e workload Samsung Tizen
        run: |
          curl -fsSL https://dot.net/v1/dotnet-install.sh | bash -s -- --channel 8.0 --install-dir "$DOTNET_ROOT"
          export PATH="$DOTNET_ROOT:$PATH"
          curl -fsSL https://raw.githubusercontent.com/Samsung/Tizen.NET/main/workload/scripts/workload-install.sh -o workload-install.sh
          bash workload-install.sh

      - name: Instalar ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Ajustar plataforma ARM para QEMU
        run: sed -i 's#linux/arm/v5#linux/arm#g' tools/tpk.sh

      - name: Preparar local.properties temporario (GitHub Secrets)
        env:
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          BESTCINE_CLIENT_SECRET: ${{ secrets.BESTCINE_CLIENT_SECRET }}
          BESTCINE_SERVER_URL: ${{ secrets.BESTCINE_SERVER_URL }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          NUVIO_SUPABASE_URL: ${{ secrets.NUVIO_SUPABASE_URL }}
          NUVIO_SUPABASE_ANON_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
        run: |
          umask 077
          {
            [ -n "$TRAKT_CLIENT_ID" ] && printf 'TRAKT_CLIENT_ID=%s\n' "$TRAKT_CLIENT_ID"
            [ -n "$TRAKT_CLIENT_SECRET" ] && printf 'TRAKT_CLIENT_SECRET=%s\n' "$TRAKT_CLIENT_SECRET"
            [ -n "$SIMKL_CLIENT_ID" ] && printf 'SIMKL_CLIENT_ID=%s\n' "$SIMKL_CLIENT_ID"
            [ -n "$TMDB_API_KEY" ] && printf 'TMDB_API_KEY=%s\n' "$TMDB_API_KEY"
            [ -n "$BESTCINE_CLIENT_SECRET" ] && printf 'BESTCINE_CLIENT_SECRET=%s\n' "$BESTCINE_CLIENT_SECRET"
            [ -n "$BESTCINE_SERVER_URL" ] && printf 'BESTCINE_SERVER_URL=%s\n' "$BESTCINE_SERVER_URL"
            [ -n "$DISCORD_CLIENT_ID" ] && printf 'DISCORD_CLIENT_ID=%s\n' "$DISCORD_CLIENT_ID"
            [ -n "$NUVIO_SUPABASE_URL" ] && printf 'NUVIO_SUPABASE_URL=%s\n' "$NUVIO_SUPABASE_URL"
            [ -n "$NUVIO_SUPABASE_ANON_KEY" ] && printf 'NUVIO_SUPABASE_ANON_KEY=%s\n' "$NUVIO_SUPABASE_ANON_KEY"
            printf 'SIMKL_APP_NAME=BestCine\n'
          } > local.properties

      - name: Compilar os 4 pacotes Samsung Tizen (.tpk)
        run: |
          export PATH="$DOTNET_ROOT:$PATH"
          set -o pipefail
          bash tools/tpk.sh 2>&1 | tee build-tpk.log
          mkdir -p dist-tpk
          for f in build/tpk/*.tpk; do
            base="$(basename "$f")"
            novo="${base/#Nuvio-/BestCineTV-}"
            cp "$f" "dist-tpk/$novo"
          done
          # Bibliotecas nativas para auto-atualizacao direta na TV Samsung (.tpk)
          cp build/tpk/libnuvio-*.so dist-tpk/ 2>/dev/null || true
          ls -lh dist-tpk

      - name: Salvar cache TPK
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.NUVIO_TPK_CACHE }}
          key: tpk-deps-${{ hashFiles('tools/tpk/Dockerfile', 'tools/tpk/deps.sh') }}

      - name: Verificar FFmpeg DTS
        id: dts
        if: always()
        run: |
          if [ -f "$NUVIO_TPK_CACHE/prefix-dts/.carimbo" ]; then echo "pronto=1" >> "$GITHUB_OUTPUT"; fi

      - name: Salvar cache FFmpeg DTS
        if: always() && steps.dts.outputs.pronto == '1'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.NUVIO_TPK_CACHE }}/prefix-dts
          key: tpk-dts-ffmpeg-${{ hashFiles('tools/build-dts-ffmpeg.sh') }}

      - name: Resumo em caso de erro
        if: failure()
        run: |
          echo '### Tizen TPK failed (ultimas 80 linhas)' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 80 build-tpk.log >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Limpar local.properties temporario
        if: always()
        run: rm -f local.properties

      - name: Upload artefatos Samsung TPK
        uses: actions/upload-artifact@v4
        with:
          name: dist-tpk
          path: dist-tpk/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 3. Samsung Tizen 5.5+ WebAssembly (.wgt)
  # ---------------------------------------------------------------------------
  tizen-wgt:
    name: Samsung Tizen WASM (.wgt)
    if: ${{ github.event.inputs.incluir_wgt != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias de sistema
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg zip meson ninja-build pkg-config autoconf automake libtool

      - name: Configurar Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Restaurar cache libass WASM
        uses: actions/cache@v4
        with:
          path: build/ass-wasm
          key: ass-wasm-${{ hashFiles('tools/build-ass-wasm.sh') }}

      - name: Compilar libass WASM (se necessario)
        run: |
          if [ ! -f build/ass-wasm/lib/libass.a ]; then
            bash tools/build-ass-wasm.sh
          fi

      - name: Preparar local.properties temporario (GitHub Secrets)
        env:
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          BESTCINE_CLIENT_SECRET: ${{ secrets.BESTCINE_CLIENT_SECRET }}
          BESTCINE_SERVER_URL: ${{ secrets.BESTCINE_SERVER_URL }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          NUVIO_SUPABASE_URL: ${{ secrets.NUVIO_SUPABASE_URL }}
          NUVIO_SUPABASE_ANON_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
        run: |
          umask 077
          {
            [ -n "$TRAKT_CLIENT_ID" ] && printf 'TRAKT_CLIENT_ID=%s\n' "$TRAKT_CLIENT_ID"
            [ -n "$TRAKT_CLIENT_SECRET" ] && printf 'TRAKT_CLIENT_SECRET=%s\n' "$TRAKT_CLIENT_SECRET"
            [ -n "$SIMKL_CLIENT_ID" ] && printf 'SIMKL_CLIENT_ID=%s\n' "$SIMKL_CLIENT_ID"
            [ -n "$TMDB_API_KEY" ] && printf 'TMDB_API_KEY=%s\n' "$TMDB_API_KEY"
            [ -n "$BESTCINE_CLIENT_SECRET" ] && printf 'BESTCINE_CLIENT_SECRET=%s\n' "$BESTCINE_CLIENT_SECRET"
            [ -n "$BESTCINE_SERVER_URL" ] && printf 'BESTCINE_SERVER_URL=%s\n' "$BESTCINE_SERVER_URL"
            [ -n "$DISCORD_CLIENT_ID" ] && printf 'DISCORD_CLIENT_ID=%s\n' "$DISCORD_CLIENT_ID"
            [ -n "$NUVIO_SUPABASE_URL" ] && printf 'NUVIO_SUPABASE_URL=%s\n' "$NUVIO_SUPABASE_URL"
            [ -n "$NUVIO_SUPABASE_ANON_KEY" ] && printf 'NUVIO_SUPABASE_ANON_KEY=%s\n' "$NUVIO_SUPABASE_ANON_KEY"
            printf 'SIMKL_APP_NAME=BestCine\n'
          } > local.properties

      - name: Compilar BestCine TV (.wgt)
        run: |
          set -o pipefail
          ln -sfn "$EMSDK" "$HOME/emsdk"
          VER=$(python3 -c 'import json; print(json.load(open("deploy/app/appinfo.json"))["version"])')
          export NUVIO_WGT_NOME="BestCineTV-${VER}-tizen"
          bash tools/tizen.sh 2>&1 | tee build-wgt.log
          bash tools/tizen-wgt.sh 2>&1 | tee -a build-wgt.log
          mkdir -p dist-wgt
          cp ./*.wgt dist-wgt/ 2>/dev/null || cp build/*.wgt dist-wgt/
          ls -lh dist-wgt

      - name: Resumo em caso de erro
        if: failure()
        run: |
          echo '### Tizen WGT failed (ultimas 80 linhas)' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 80 build-wgt.log >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Limpar local.properties temporario
        if: always()
        run: rm -f local.properties

      - name: Upload artefato Samsung WGT
        uses: actions/upload-artifact@v4
        with:
          name: dist-wgt
          path: dist-wgt/*.wgt
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 4. Android TV / Google TV 7+ (.apk universal arm64 + armv7)
  # ---------------------------------------------------------------------------
  android-tv:
    name: Android TV / Google TV (.apk)
    if: ${{ github.event.inputs.incluir_android != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      NUVIO_P2P_MOTOR: ${{ github.workspace }}/.cache/nuvio-p2p-motor
      NUVIO_APK_LITE: "0"
      NUVIO_PULAR_LITE: "1"
      NUVIO_RUST_MKVCORE: "0"
      NUVIO_ANDROID_CACHE: ${{ github.workspace }}/.cache/nuvio-android
    steps:
      - uses: actions/checkout@v4

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar pacotes Android SDK/NDK 27 + ferramentas
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg ninja-build cmake perl make
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" --install "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1"

      - name: Restaurar cache dependencias nativas Android
        uses: actions/cache@v4
        with:
          path: ${{ env.NUVIO_ANDROID_CACHE }}
          key: android-deps-${{ hashFiles('tools/android/deps.sh') }}

      - name: Restaurar cache motor P2P nativo Android (nuvio-engine + libtorrent)
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.NUVIO_P2P_MOTOR }}/android/lib
            ${{ env.NUVIO_P2P_MOTOR }}/android/include
          key: android-p2p-motor-${{ hashFiles('tools/p2p-motor/build-android.sh', 'tools/p2p-motor/pasta.sh', 'tools/p2p-motor/janela-334.patch') }}

      - name: Compilar motor P2P nativo Android (se nao estiver em cache)
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          export NV_JOBS="$(nproc)"
          P2P_DIR="$NUVIO_P2P_MOTOR/android"
          if [ -s "$P2P_DIR/lib/arm64-v8a/libnuvio_engine.a" ] && [ -s "$P2P_DIR/lib/armeabi-v7a/libnuvio_engine.a" ] && [ -s "$P2P_DIR/include/nuvio_engine/nuvio_engine.h" ]; then
            echo "Motor P2P Android restaurado do cache."
          else
            bash tools/p2p-motor/build-android.sh "$P2P_DIR"
          fi

      - name: Compilar libcurl/libjpeg/libwebp para Android
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          bash tools/android/deps.sh arm64-v8a armeabi-v7a

      - name: Preparar local.properties temporario (GitHub Secrets)
        env:
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          BESTCINE_CLIENT_SECRET: ${{ secrets.BESTCINE_CLIENT_SECRET }}
          BESTCINE_SERVER_URL: ${{ secrets.BESTCINE_SERVER_URL }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          NUVIO_SUPABASE_URL: ${{ secrets.NUVIO_SUPABASE_URL }}
          NUVIO_SUPABASE_ANON_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
        run: |
          umask 077
          {
            [ -n "$TRAKT_CLIENT_ID" ] && printf 'TRAKT_CLIENT_ID=%s\n' "$TRAKT_CLIENT_ID"
            [ -n "$TRAKT_CLIENT_SECRET" ] && printf 'TRAKT_CLIENT_SECRET=%s\n' "$TRAKT_CLIENT_SECRET"
            [ -n "$SIMKL_CLIENT_ID" ] && printf 'SIMKL_CLIENT_ID=%s\n' "$SIMKL_CLIENT_ID"
            [ -n "$TMDB_API_KEY" ] && printf 'TMDB_API_KEY=%s\n' "$TMDB_API_KEY"
            [ -n "$BESTCINE_CLIENT_SECRET" ] && printf 'BESTCINE_CLIENT_SECRET=%s\n' "$BESTCINE_CLIENT_SECRET"
            [ -n "$BESTCINE_SERVER_URL" ] && printf 'BESTCINE_SERVER_URL=%s\n' "$BESTCINE_SERVER_URL"
            [ -n "$DISCORD_CLIENT_ID" ] && printf 'DISCORD_CLIENT_ID=%s\n' "$DISCORD_CLIENT_ID"
            [ -n "$NUVIO_SUPABASE_URL" ] && printf 'NUVIO_SUPABASE_URL=%s\n' "$NUVIO_SUPABASE_URL"
            [ -n "$NUVIO_SUPABASE_ANON_KEY" ] && printf 'NUVIO_SUPABASE_ANON_KEY=%s\n' "$NUVIO_SUPABASE_ANON_KEY"
            printf 'SIMKL_APP_NAME=BestCine\n'
          } > local.properties

      - name: Compilar APK universal assinado BestCine TV (arm64 e armv7 com P2P nativo)
        env:
          NUVIO_KEYSTORE_BASE64: ${{ secrets.NUVIO_KEYSTORE_BASE64 }}
          NUVIO_KEYSTORE_PASS: ${{ secrets.NUVIO_KEYSTORE_PASS }}
          NUVIO_KEY_ALIAS: ${{ secrets.NUVIO_KEY_ALIAS }}
          NUVIO_KEY_PASS: ${{ secrets.NUVIO_KEY_PASS }}
        run: |
          set -o pipefail
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          VER=$(python3 -c 'import json; print(json.load(open("deploy/app/appinfo.json"))["version"])')
          mkdir -p dist-android
          APK="dist-android/BestCineTV-android.apk"
          APK_COMPAT="dist-android/BestCineTV-android-lite-universal.apk"

          if [ -n "$NUVIO_KEYSTORE_BASE64" ] && [ -n "$NUVIO_KEYSTORE_PASS" ] && [ -n "$NUVIO_KEY_ALIAS" ] && [ -n "$NUVIO_KEY_PASS" ]; then
            umask 077
            printf '%s' "$NUVIO_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/bestcine-release.jks"
            export NUVIO_KEYSTORE="$RUNNER_TEMP/bestcine-release.jks"
            trap 'rm -f "$RUNNER_TEMP/bestcine-release.jks"' EXIT
            bash tools/android.sh --release-only 2>&1 | tee build-android.log
            cp "build/android/Nuvio-${VER}-android.apk" "$APK"
            SIGN_MODE="Release (keystore oficial BestCine)"
          else
            bash tools/android.sh --debug-only 2>&1 | tee build-android.log
            cp "build/android/Nuvio-${VER}-android-debug.apk" "$APK"
            SIGN_MODE="Debug (fallback sem keystore)"
          fi

          # Mantem tambem o nome legado BestCineTV-android-lite-universal.apk apontando
          # para o mesmo APK completo com P2P nativo, preservando o codigo 6617912 do
          # Downloader, links do site e o auto-update de instalacoes anteriores.
          cp "$APK" "$APK_COMPAT"

          # Confere o arquivo que será publicado, não apenas o APK intermediário.
          actual_abis=$(unzip -Z1 "$APK" | sed -n 's#^lib/\([^/][^/]*\)/.*#\1#p' | sort -u)
          expected_abis=$(printf '%s\n' arm64-v8a armeabi-v7a | sort -u)
          if [ "$actual_abis" != "$expected_abis" ]; then
            echo "ABIs inesperadas no APK: $actual_abis" >&2
            exit 1
          fi

          {
            echo "### Android TV APK (com motor P2P nativo)"
            echo "- Assinatura: $SIGN_MODE"
            echo "- ABIs: arm64-v8a e armeabi-v7a"
            echo "- Motor P2P: nuvio-engine + libtorrent (embutido)"
            echo "- SHA-256: $(sha256sum "$APK" | cut -d' ' -f1)"
          } >> "$GITHUB_STEP_SUMMARY"
          ls -lh dist-android

      - name: Resumo em caso de erro
        if: failure()
        run: |
          echo '### Android TV build failed (ultimas 80 linhas)' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 80 build-android.log >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Limpar local.properties temporario
        if: always()
        run: rm -f local.properties

      - name: Upload artefatos Android TV
        uses: actions/upload-artifact@v4
        with:
          name: dist-android
          path: dist-android/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 5. Publicar Release no GitHub com todos os instaladores compilados
  # ---------------------------------------------------------------------------
  publish-release:
    name: Publicar Release BestCine TV
    needs: [webos, tizen-tpk, tizen-wgt, android-tv]
    if: always() && (github.event.inputs.publicar_release != 'false') && (needs.webos.result == 'success' || needs.tizen-tpk.result == 'success' || needs.tizen-wgt.result == 'success' || needs.android-tv.result == 'success')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Baixar artefatos gerados
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: release-assets
          merge-multiple: true

      - name: Criar/atualizar Release no GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(python3 -c 'import json; print(json.load(open("deploy/app/appinfo.json"))["version"])')
          TAG="${{ github.event.inputs.tag }}"
          [ -n "$TAG" ] || TAG="v${VER}"
          ls -lh release-assets

          test -s RELEASE_NOTES.md
          cp RELEASE_NOTES.md release-notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
            gh release edit "$TAG" --title "BestCine TV ${TAG}" --notes-file release-notes.md
          else
            gh release create "$TAG" release-assets/* \
              --title "BestCine TV ${TAG}" \
              --notes-file release-notes.md \
              --target master
          fi
